name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: The Swift package builds for iOS
        run: xcodebuild -scheme BavrkCapacitorGameCenter -destination 'generic/platform=iOS' build
